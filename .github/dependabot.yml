# SPDX-License-Identifier: Apache-2.0
#
# Automated dependency version updates. The github-actions updater keeps the
# SHA-pinned actions in .github/workflows current (Dependabot bumps the pin and
# the trailing version comment together); cargo and npm cover the Rust workspace
# and the VS Code extension. Minor/patch bumps are grouped to reduce PR noise.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/editors/vscode"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
