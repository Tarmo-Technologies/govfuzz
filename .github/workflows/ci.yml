name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Test VS Code extension
        run: |
          npm ci --prefix editors/vscode
          npm test --prefix editors/vscode

      - name: Test GNAT Studio plugin helpers
        run: python3 -m unittest discover -s editors/gnatstudio/tests

      - name: Build workspace
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Validate confidence model
        run: cargo test -p confidence_model -- --nocapture

      - name: Validate learned confidence CLI
        run: cargo test -p govfuzz model -- --nocapture

      - name: Validate daemon RPC trait
        run: cargo test -p govfuzz-daemon -- --nocapture

      - name: Validate SARIF emitter
        run: cargo test -p report sarif -- --nocapture

      - name: Validate JUnit emitter
        run: cargo test -p report junit -- --nocapture

  rhel7-build:
    name: RHEL 7 compatible build
    runs-on: ubuntu-latest
    env:
      RHEL7_BUILD_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:0d25b049964b2549b83384036abdff06789a8c0b1e9ff003ec80f0d531f79e50
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and test on the RHEL 7 ABI
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" \
            --workdir /io \
            --env CARGO_HOME=/tmp/cargo \
            --env RUSTUP_HOME=/tmp/rustup \
            --env CARGO_TARGET_DIR=/io/target/rhel7 \
            "$RHEL7_BUILD_IMAGE" \
            bash -lc '
              set -euo pipefail
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$CARGO_HOME/bin:$PATH"
              cargo test --locked -p govfuzz --test offline_dist_scripts -- --nocapture
              cargo build --locked --release --workspace
              scripts/check-linux-release-abi.sh "$CARGO_TARGET_DIR/release"
            '

  windows-build:
    name: Windows MSVC build and tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Test Windows-specific logic and daemon
        shell: pwsh
        run: |
          cargo test --locked -p govfuzz-daemon --lib
          cargo test --locked -p govfuzz --lib windows
          cargo test --locked -p govfuzz --lib vcxproj

      - name: Build Windows release artifacts
        run: cargo build --locked --release -p govfuzz -p govfuzz-daemon --target x86_64-pc-windows-msvc

      - name: Smoke Windows executables
        shell: pwsh
        run: |
          .\target\x86_64-pc-windows-msvc\release\govfuzz.exe --version
          .\target\x86_64-pc-windows-msvc\release\govfuzz-daemon.exe --help
          .\target\x86_64-pc-windows-msvc\release\govfuzz.exe scan `
            tests\fixtures\engine_parity\magic_byte `
            --work-dir "$env:RUNNER_TEMP\govfuzz-windows-scan"
          .\target\x86_64-pc-windows-msvc\release\govfuzz.exe auto `
            tests\fixtures\engine_parity\magic_byte `
            --work-dir "$env:RUNNER_TEMP\govfuzz-windows-plan" `
            --languages c --list-targets --no-discovery-cache

      - name: Install Windows C fuzz smoke prerequisites
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm --yes --no-progress
          }
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
          }
          clang --version
          make --version

      - name: Run native Windows C fuzz smoke
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio C++ Build Tools were not found"
          }
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64"
          Get-Command link.exe | Format-List Source

          $work = "$env:RUNNER_TEMP\govfuzz-windows-fuzz"
          .\target\x86_64-pc-windows-msvc\release\govfuzz.exe auto `
            tests\fixtures\engine_parity\magic_byte `
            --work-dir $work `
            --languages c `
            --target parse_frame `
            --iterations 32 `
            --single-pass `
            --sanitizers none `
            --per-target-time 5 `
            --no-discovery-cache `
            --verbose
          $report = Get-Content "$work\auto\run.json" -Raw | ConvertFrom-Json
          if ($report.summary.built_and_fuzzed -ne 1) {
            Get-ChildItem $work -Recurse -File |
              Where-Object { $_.Name -in @("Makefile", "result.json", "run.json", "missing-deps.txt", "bug-report.md") } |
              ForEach-Object {
                Write-Host "--- $($_.FullName)"
                Get-Content $_.FullName
              }
            throw "Windows smoke did not build and fuzz parse_frame: $($report.summary | ConvertTo-Json -Compress)"
          }
