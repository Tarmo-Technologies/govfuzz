# SPDX-License-Identifier: Apache-2.0

name: GNAT Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  full-fixture-matrix:
    name: GNAT ${{ matrix.gnat }} / ${{ matrix.dialect }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gnat: ["11", "12", "13", "14"]
        dialect: [ada95, ada2005, ada2012, ada2022]
        profile: [strict-permissive, external-tools]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install GNAT
        run: |
          sudo apt-get update
          # `gcc-N` so the matrix cell has a C compiler of the SAME major as its
          # Ada one: the runner image only ships the default gcc, and
          # run-gnat-fixture-matrix.sh now asks gprconfig for `C,,,,gcc-N` by
          # name. Without both halves the generated config has no C driver and
          # every cell dies on `adafuzz_runtime.gpr:2:09: no compiler for
          # language "C"` — which this matrix had been doing on every nightly.
          sudo apt-get install -y gprbuild gnat-${{ matrix.gnat }} gcc-${{ matrix.gnat }}

      - name: Run fixture matrix cell
        env:
          GOVFUZZ_GNAT_VERSION: ${{ matrix.gnat }}
          GOVFUZZ_ADA_DIALECT: ${{ matrix.dialect }}
          GOVFUZZ_PROFILE: ${{ matrix.profile }}
        run: scripts/ci/run-gnat-fixture-matrix.sh
