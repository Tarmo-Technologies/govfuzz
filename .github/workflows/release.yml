#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      DIST_ARGS: ${{ matrix.dist_args }}
      DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RHEL7_BUILD_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:0d25b049964b2549b83384036abdff06789a8c0b1e9ff003ec80f0d531f79e50
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build Linux artifacts on the RHEL 7 ABI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Build the Linux matrix entry against manylinux2014 / glibc 2.17
          # while JavaScript actions stay on the modern host runner.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env GH_TOKEN \
            --env DIST_ARGS \
            --env DIST_TAG_FLAG \
            --env CARGO_HOME=/tmp/cargo \
            --env RUSTUP_HOME=/tmp/rustup \
            "$RHEL7_BUILD_IMAGE" \
            bash -lc '
              set -euo pipefail
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$CARGO_HOME/bin:$PATH"
              curl --proto "=https" --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
              dist build $DIST_TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
              release_dir=target/x86_64-unknown-linux-gnu/dist
              [[ -d $release_dir ]] || release_dir=target/dist
              scripts/check-linux-release-abi.sh "$release_dir"
            '
          echo "dist ran successfully"
      - name: Build and exercise all-in-one Linux installer bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          release_dir=target/x86_64-unknown-linux-gnu/dist
          [[ -d "$release_dir" ]] || release_dir=target/dist
          version="${RELEASE_TAG:-$(git describe --tags --always)}"
          safe_version="$(printf '%s' "$version" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          bundle_name="govfuzz-dist-${safe_version}-x86_64-unknown-linux-gnu"

          scripts/package-offline-dist.sh \
            --artifact-dir "$release_dir" \
            --out target/distrib \
            --version "$version" \
            --target-triple x86_64-unknown-linux-gnu

          archive="target/distrib/${bundle_name}.tar.gz"
          sidecar="${archive}.sha256"
          test -f "$archive"
          test -f "$sidecar"
          (cd target/distrib && sha256sum -c "${bundle_name}.tar.gz.sha256")

          verify_root="$(mktemp -d)"
          install_root="$(mktemp -d)"
          tar -xzf "$archive" -C "$verify_root"
          bundle_root="$verify_root/$bundle_name"
          test -x "$bundle_root/install.sh"
          test -f "$bundle_root/INSTALL.md"
          test -x "$bundle_root/tool/govfuzz"
          test -x "$bundle_root/tool/govfuzz-daemon"
          test -f "$bundle_root/tool/libgovfuzz_runtrace_shim.so"
          test -f "$bundle_root/tool/libgovfuzz_cc_intercept.so"

          "$bundle_root/install.sh" \
            --non-interactive \
            --prefix "$install_root/prefix" \
            --bin-dir "$install_root/bin" \
            --languages c \
            --targets native \
            --fuzzers builtin \
            --extras none \
            --no-system-packages \
            --no-rustup \
            --no-content \
            --no-symlink
          "$install_root/prefix/govfuzz" --version
          test -f "$install_root/prefix/libgovfuzz_runtrace_shim.so"
          test -f "$install_root/prefix/libgovfuzz_cc_intercept.so"
      - name: Build Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dist build $DIST_TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
      - name: Validate packaged harness runtimes (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive=target/distrib/govfuzz-x86_64-unknown-linux-gnu.tar.xz
          [[ -f "$archive" ]] || { echo "govfuzz Linux archive not found" >&2; exit 1; }
          entries=$(tar -tf "$archive")
          for marker in \
            ada_runtime/adafuzz.ads \
            c_runtime/govfuzz_driver.c \
            csharp_runtime/Driver.cs \
            java_runtime/build-agent.sh \
            js_runtime/govfuzz_driver.js \
            lua_runtime/govfuzz_driver.lua \
            perl_runtime/Devel/GovfuzzCov.pm \
            php_runtime/govfuzz_driver.php \
            python_runtime/govfuzz_driver.py \
            ruby_runtime/govfuzz_driver.rb \
            rust_runtime/Cargo.toml
          do
            grep -Fq "$marker" <<<"$entries" || { echo "missing $marker from $archive" >&2; exit 1; }
          done
      - name: Validate install guide in every Linux component archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for archive in \
            target/distrib/govfuzz-x86_64-unknown-linux-gnu.tar.xz \
            target/distrib/govfuzz-daemon-x86_64-unknown-linux-gnu.tar.xz \
            target/distrib/govfuzz_runtrace_shim-x86_64-unknown-linux-gnu.tar.xz \
            target/distrib/govfuzz_cc_intercept-x86_64-unknown-linux-gnu.tar.xz
          do
            tar -tf "$archive" | grep -Eq '(^|/)INSTALL\.md$' || {
              echo "missing INSTALL.md from $archive" >&2
              exit 1
            }
          done
      - name: Validate packaged harness runtimes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-Item target/distrib/govfuzz-x86_64-pc-windows-msvc.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            $markers = @(
              "ada_runtime/adafuzz.ads",
              "c_runtime/govfuzz_driver.c",
              "csharp_runtime/Driver.cs",
              "java_runtime/build-agent.sh",
              "js_runtime/govfuzz_driver.js",
              "lua_runtime/govfuzz_driver.lua",
              "perl_runtime/Devel/GovfuzzCov.pm",
              "php_runtime/govfuzz_driver.php",
              "python_runtime/govfuzz_driver.py",
              "ruby_runtime/govfuzz_driver.rb",
              "rust_runtime/Cargo.toml"
            )
            foreach ($marker in $markers) {
              if (-not ($entries | Where-Object { $_ -eq $marker -or $_.EndsWith("/$marker") })) {
                throw "missing $marker from $($archive.FullName)"
              }
            }
          } finally {
            $zip.Dispose()
          }
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          if [[ "$RUNNER_OS" == Linux ]]; then
            printf '%s\n' \
              target/distrib/govfuzz-dist-*.tar.gz \
              target/distrib/govfuzz-dist-*.tar.gz.sha256 >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          python3 scripts/augment-release-installer.py target/distrib/govfuzz-installer.sh
          python3 scripts/fix-dist-shell-installer.py \
            target/distrib/govfuzz-installer.sh \
            target/distrib/govfuzz-daemon-installer.sh \
            target/distrib/govfuzz_runtrace_shim-installer.sh \
            target/distrib/govfuzz_cc_intercept-installer.sh
          python3 scripts/fix-dist-library-installer.py \
            target/distrib/govfuzz_runtrace_shim-installer.sh \
            target/distrib/govfuzz_cc_intercept-installer.sh
          python3 scripts/fix-dist-powershell-installer.py \
            target/distrib/govfuzz-installer.ps1 \
            target/distrib/govfuzz-daemon-installer.ps1
          grep -Fq GOVFUZZ_RHEL7_GUIDANCE_BEGIN target/distrib/govfuzz-installer.sh
          grep -Fq "need_cmd xz" target/distrib/govfuzz-installer.sh
          grep -Fq "need_cmd xz" target/distrib/govfuzz-daemon-installer.sh
          grep -Fq "need_cmd xz" target/distrib/govfuzz_runtrace_shim-installer.sh
          grep -Fq "need_cmd xz" target/distrib/govfuzz_cc_intercept-installer.sh
          grep -Fq "chmod +x \"\$_lib_install_temp/\$_lib_name\"" \
            target/distrib/govfuzz_runtrace_shim-installer.sh
          grep -Fq "chmod +x \"\$_lib_install_temp/\$_lib_name\"" \
            target/distrib/govfuzz_cc_intercept-installer.sh
          grep -Fq "\$ProgressPreference = \"SilentlyContinue\"" \
            target/distrib/govfuzz-installer.ps1
          grep -Fq "\$ProgressPreference = \"SilentlyContinue\"" \
            target/distrib/govfuzz-daemon-installer.ps1
          grep -Fq "Avoid console progress-buffer access" \
            target/distrib/govfuzz-installer.ps1
          grep -Fq "Avoid console progress-buffer access" \
            target/distrib/govfuzz-daemon-installer.ps1
          echo "dist ran successfully"

          for sidecar in target/distrib/govfuzz-dist-*.tar.gz.sha256; do
            [[ -f "$sidecar" ]] || continue
            cat "$sidecar" >> target/distrib/sha256.sum
          done
          LC_ALL=C sort -u -o target/distrib/sha256.sum target/distrib/sha256.sum

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
