# SPDX-License-Identifier: Apache-2.0

[advisories]
# RUSTSEC security advisories. Under the v2 format, crates with an active
# vulnerability advisory are denied automatically; yanked crates are treated as
# errors too. `ignore` is the audited escape hatch for a specific advisory id.
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
