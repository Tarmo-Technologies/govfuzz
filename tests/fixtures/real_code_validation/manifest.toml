# SPDX-License-Identifier: Apache-2.0

[settings]
per_target_time = 2
# #104: `ada_local` is the hermetic, dependency-free Ada endpoint that proves real
# Ada target entry offline in normal CI (the pinned real Ada repos need Alire and
# are the scheduled/network job).
bounded_subset = ["cjson", "tinyxml2", "ada_local"]

[[repositories]]
id = "cjson"
url = "https://github.com/DaveGamble/cJSON.git"
rev = "fb16e5cf358798aabb049655975cde8427101056"
language = "c"
license = "MIT"

[[repositories.prepare]]
kind = "cmake"
build_dir = "build"
args = [
  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
  "-DENABLE_CJSON_TEST=OFF",
  "-DENABLE_CJSON_UTILS=OFF",
]

[[repositories.checks]]
kind = "list_targets"
path = "."
top = 10
min_targets = 5

[[repositories.checks]]
kind = "generate_harness_build"
source = "cJSON.c"
target = "cJSON_ParseWithLength"
harness_id = "H-REAL-CJSON"
expect_makefile_contains = [
  "COMPILE_DB_FLAGS =",
  "-std=c89",
  "-DCJSON_API_VISIBILITY",
]

# #104: end-to-end auto that must BUILD and ENTER the real C endpoint (control).
[[repositories.checks]]
kind = "auto_target_entry"
target = "cJSON_ParseWithLength"
harness_id = "H-REAL-CJSON-ENTRY"
per_target_time = 3

[[repositories.scenarios]]
id = "cjson_missing_public_header"
kind = "auto_missing_file"
description = "Remove cJSON.h from a real cJSON checkout and assert auto reports the missing public API header."
remove_files = ["cJSON.h"]
targets = ["cJSON_ParseWithLength"]
per_target_time = 2

[[repositories.scenarios.expect_needed]]
bucket = "synthesized_headers"
locator = "cJSON.h"

[[repositories]]
id = "tinyxml2"
url = "https://github.com/leethomason/tinyxml2.git"
rev = "8224e427b655b83dae5e2298f1e6919523a78737"
language = "cpp"
license = "Zlib"

[[repositories.prepare]]
kind = "cmake"
build_dir = "build"
args = ["-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]

[[repositories.checks]]
kind = "list_targets"
path = "."
top = 10
min_targets = 5

[[repositories.checks]]
kind = "generate_harness_build"
source = "tinyxml2.cpp"
target = "tinyxml2::XMLDocument::Parse"
harness_id = "H-REAL-TINYXML2"
expect_makefile_contains = [
  "COMPILE_DB_FLAGS =",
  # #104: the current exact TU provenance value (was the stale `compile_commands`).
  "BUILD_CONTEXT_PROVENANCE = exact_tu_compile_database",
  "BUILD_CONTEXT_CONFIDENCE = high",
  "-D_FILE_OFFSET_BITS=64",
]

# #104: end-to-end auto that must BUILD and ENTER the real C++ endpoint (control).
[[repositories.checks]]
kind = "auto_target_entry"
target = "tinyxml2::XMLDocument::Parse"
harness_id = "H-REAL-TINYXML2-ENTRY"
per_target_time = 3

[[repositories.scenarios]]
id = "tinyxml2_missing_public_header"
kind = "auto_missing_file"
description = "Remove tinyxml2.h from a real tinyxml2 checkout and assert auto categorizes the resulting undefined-type target as report-only (statically analyzed, not fuzzed)."
remove_files = ["tinyxml2.h"]
# #104: regenerate the compile database on the copy so the removed header is not
# still resolved through the original tree's `-I` (a cmake project).
reprepare = true
targets = ["tinyxml2::XMLDocument::Parse"]
per_target_time = 2
# #104: a missing C++ public header makes the target's return type undefined, so
# the categorized recovery is a report-only degradation (not C-style header
# synthesis). Assert that intended outcome + reason.
expect_outcome = "report_only"
expect_reason_contains = "undefined in the scanned tree"

[[repositories]]
id = "adayaml"
url = "https://github.com/yaml/AdaYaml.git"
rev = "7fde22a1a564bbece3e97430f469717ac46e5842"
language = "ada"
license = "MIT"

[[repositories.checks]]
kind = "list_targets"
path = "."
top = 10
min_targets = 10

[[repositories.checks]]
kind = "scan"
path = "."
min_targets = 1000

[[repositories.checks]]
kind = "generate_harness_gpr"
source = "src/interface/yaml-dom-loading.ads"
target = "from_string"
harness_id = "H-REAL-ADAYAML-FROM-STRING"
source_tree = "."
project = "yaml.gpr"

[[repositories]]
id = "ada_util"
url = "https://github.com/stcarrez/ada-util.git"
rev = "3f4f187deeec2a4164c19a03a04c0a79962ff61f"
language = "ada"
license = "Apache-2.0"

[[repositories.checks]]
kind = "list_targets"
path = "."
top = 10
min_targets = 10

[[repositories.checks]]
kind = "instrument"
source = "src/base/dates/util-dates-iso8601.adb"

[[repositories.checks]]
kind = "generate_harness_gpr"
source = "src/base/dates/util-dates-iso8601.adb"
target = "value"
harness_id = "H-REAL-ADA-UTIL"
source_tree = "src"
project = "utilada_base.gpr"
expect_status = "toolchain_gap"
expect_stderr_contains = "To_Duration_64"

[[repositories.scenarios]]
id = "ada_util_gnat13_calendar_conversions_gap"
kind = "toolchain_gap"
description = "ada-util's pinned Util.Dates body selects GCC 15 Ada.Calendar.Conversions APIs by default; the validation host uses GNAT 13."

# #104: hermetic, dependency-free Ada endpoint (checked into the tree) that auto
# BUILDS and ENTERS with NO --project — proving real Ada target entry offline in
# normal CI while exercising automatic governing-GPR selection (#91). The pinned
# real Ada repos (adayaml/ada_util) above remain the scheduled/network evidence.
[[repositories]]
id = "ada_local"
local_path = "ada_local"
language = "ada"
license = "Apache-2.0"

[[repositories.checks]]
kind = "list_targets"
path = "."
top = 10
min_targets = 1

[[repositories.checks]]
kind = "auto_target_entry"
target = "Parse"
harness_id = "H-LOCAL-ADA-ENTRY"
per_target_time = 3

# #104: hermetic Ada broken-build evidence. `Dep_Parser.Check` withs `Vendor_Lib`;
# removing that unit's source reproduces the real failure mode of legacy Ada
# projects whose Alire/GPR dependencies can't be resolved offline. auto must
# categorize this as a failed build that NAMES the unresolved unit (not crash,
# not silently pass) — the Ada counterpart to the C/C++ missing-header scenarios.
[[repositories.scenarios]]
id = "ada_local_missing_dependency"
kind = "auto_missing_file"
description = "Remove the in-tree Vendor_Lib dependency and assert auto categorizes the dependent Ada target as a failed build naming the unresolved unit."
remove_files = ["src/vendor_lib.ads", "src/vendor_lib.adb"]
targets = ["Check"]
per_target_time = 2
expect_outcome = "failed_build"

[[repositories.scenarios.expect_needed]]
bucket = "missing_ada_units"
locator = "vendor_lib.Score"
